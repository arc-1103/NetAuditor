[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudit-schema"
version = "1.0.0"
description = "Shared SecurityBaseline models for NetAuditor"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic==2.9.2"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["schema*"]
