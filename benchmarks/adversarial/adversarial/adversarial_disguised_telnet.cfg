! NetAudit Engine adversarial-benchmark fixture — ADVERSARIAL class
! Designed to look compliant to a naive substring/keyword scan while
! actually being insecure: a comment claims telnet is disabled using the
! exact keyword text a careless parser might grep for, right next to the
! real, active directive that re-enables it. A correct parser must respect
! Cisco's "!" comment syntax (a comment is not a directive) and read only
! the active "transport input telnet ssh" line as ground truth.
version 17.9
hostname branch-core-adversarial
service password-encryption
banner login ^CUnauthorized access is prohibited and monitored.^C
!
! SECURITY NOTE: telnet is disabled on this device per policy AUD-114.
! line vty 0 4
!  transport input ssh
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 10.92.0.5 255.255.255.252
 no shutdown
!
no ip http server
ip http secure-server
ip ssh version 2
ip access-list standard MANAGEMENT-ONLY
 permit 10.92.10.0 0.0.0.255
 deny any log
!
snmp-server group NETAUDIT v3 priv
snmp-server user auditor NETAUDIT v3 auth sha demo-auth priv aes 256 demo-privacy
!
ntp authenticate
ntp trusted-key 10
ntp server 10.92.10.20 key 10
logging host 10.92.10.12
!
line vty 0 4
 access-class MANAGEMENT-ONLY in
 transport input telnet ssh
!
end
