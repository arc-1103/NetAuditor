! NetAudit Engine adversarial-benchmark fixture — AMBIGUOUS class
! Two separate vty line ranges with genuinely different transport policies:
! 0-4 is SSH-only, but 5-15 still allows telnet. A flat "last directive
! wins" scalar reader (see benchmarks/adversarial/README.md) collapses
! these into one telnet.enabled verdict and silently loses the fact that
! HALF the vty lines still accept telnet — this is not a parser bug in the
! traditional sense, it's a genuine representational ambiguity: "is telnet
! enabled on this device" doesn't have one right answer for this config.
version 17.9
hostname branch-core-ambiguous
service password-encryption
banner login ^CUnauthorized access is prohibited and monitored.^C
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 10.90.0.5 255.255.255.252
 no shutdown
!
no ip http server
ip http secure-server
ip ssh version 2
ip access-list standard MANAGEMENT-ONLY
 permit 10.90.10.0 0.0.0.255
 deny any log
!
snmp-server group NETAUDIT v3 priv
snmp-server user auditor NETAUDIT v3 auth sha demo-auth priv aes 256 demo-privacy
!
ntp authenticate
ntp trusted-key 10
ntp server 10.90.10.20 key 10
logging host 10.90.10.12
!
line vty 0 4
 access-class MANAGEMENT-ONLY in
 transport input ssh
!
line vty 5 15
 transport input telnet ssh
!
end
