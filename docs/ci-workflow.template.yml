# Install as .github/workflows/ci.yml using a GitHub credential with workflow scope.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [gateway, services/ingestion, services/parsing, services/compliance, services/learning/backend, services/remediation, services/reporting, services/schema, scripts]
    defaults:
      run:
        working-directory: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install shared schema for parsing
        if: matrix.lane == 'services/parsing'
        run: pip install -e ../schema
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 demo/verify_fixtures.py
      - name: Validate JSON contracts
        run: for schema in contracts/*.schema.json; do python3 -m json.tool "$schema" >/dev/null; done
      - name: Validate Compose configuration
        run: |
          ./scripts/setup_demo.sh
          docker compose config --quiet
