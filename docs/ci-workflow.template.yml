# Install as .github/workflows/ci.yml using a GitHub credential with workflow scope.
name: verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-services:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane:
          - gateway
          - scripts
          - services/ingestion
          - services/compliance
          - services/remediation
          - services/reporting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lane dependencies
        working-directory: ${{ matrix.lane }}
        run: python -m pip install -r requirements-dev.txt
      - name: Test lane
        working-directory: ${{ matrix.lane }}
        run: pytest -q

  parsing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ./services/schema -r services/parsing/requirements-dev.txt
      - working-directory: services/parsing
        run: pytest -q

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./services/schema pytest
      - working-directory: services/schema
        run: pytest -q

  learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r services/learning/backend/requirements-dev.txt
      - working-directory: services/learning/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  static-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q gateway services scripts demo benchmarks
      - run: python demo/verify_fixtures.py
      - run: bash -n demo/run_demo.sh scripts/*.sh
      - run: git diff --check
