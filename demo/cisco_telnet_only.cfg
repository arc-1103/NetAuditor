! NetAudit Engine deterministic demo fixture — Cisco IOS-XE
! Single-issue fixture: Telnet left enabled only, everything else hardened.
version 17.9
hostname access-sw-telnet-demo
service timestamps debug datetime msec
service password-encryption
!
interface GigabitEthernet0/1
 description ACCESS-UPLINK
 ip address 10.71.0.1 255.255.255.252
 no shutdown
!
no ip http server
ip ssh version 2
!
snmp-server group netaudit-group v3 priv
snmp-server user netaudit-ro netaudit-group v3 auth sha auth-pass-redacted priv aes 256 priv-pass-redacted
!
ntp server 10.71.10.20
ntp authenticate
logging host 10.71.10.30
!
banner login
Authorized access only. All activity is logged and monitored.
EOF
!
line vty 0 4
 transport input telnet ssh
!
end
