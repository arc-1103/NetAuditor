! NetAudit Engine deterministic demo fixture — hardened Cisco IOS-XE
version 17.9
hostname branch-core-02
service password-encryption
banner login ^CUnauthorized access is prohibited and monitored.^C
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 10.20.0.5 255.255.255.252
 no shutdown
!
no ip http server
ip http secure-server
ip ssh version 2
ip access-list standard MANAGEMENT-ONLY
 permit 10.20.10.0 0.0.0.255
 deny any log
!
snmp-server group NETAUDIT v3 priv
snmp-server user auditor NETAUDIT v3 auth sha demo-auth priv aes 256 demo-privacy
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
!
ntp authenticate
ntp trusted-key 10
ntp server 10.20.10.20 key 10
logging host 10.20.10.12
logging trap warnings
!
line vty 0 4
 access-class MANAGEMENT-ONLY in
 transport input ssh
!
end
