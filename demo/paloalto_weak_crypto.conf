## NetAudit Engine deterministic demo fixture — Palo Alto PAN-OS
## Single-issue fixture: weak IKE Phase 1 crypto only, everything else hardened.
set deviceconfig system hostname pan-fw-edge-03
set deviceconfig system type static
set deviceconfig system ip-address 10.50.0.9
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set network interface ethernet1/1 layer3 ip 10.50.0.9/30
set shared snmp-setting access-setting version v3 auth-password "redacted" priv-password "redacted"
set network ike crypto-profiles ike-crypto-profiles default encryption des
set network ike crypto-profiles ike-crypto-profiles default hash md5
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.50.10.20
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key
set deviceconfig system syslog-setting server netaudit-syslog server 10.50.10.30
set deviceconfig system login-banner "Authorized access only. All activity is logged and monitored."
