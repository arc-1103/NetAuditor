## NetAudit Engine deterministic demo fixture — Juniper JunOS
set version 21.4R3
set system host-name edge-router-jnpr-01
set system services ssh
set system services telnet
set system services web-management http
set system login user netops class super-user authentication plain-text-password
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.40.0.1/30;
            }
        }
    }
}
set snmp community public authorization read-only
set snmp community public clients 0.0.0.0/0
set system ntp server 10.40.10.20
set system syslog host 10.40.10.30 any notice
