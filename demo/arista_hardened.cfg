! NetAudit Engine deterministic demo fixture — Arista EOS (hardened)
! Arista
hostname spine-eos-02
daemon TerminAttr
   exec /usr/bin/TerminAttr -disableaaa=false
   no shutdown
management api http-commands
   no protocol http
   protocol https
management api gnmi
   transport grpc default
   ssl profile netaudit-gnmi
!
interface Ethernet1
   description SPINE-UPLINK
   ip address 10.60.0.5/30
!
snmp-server view netaudit-view iso included
snmp-server group netaudit-group v3 priv read netaudit-view
snmp-server user netaudit-ro netaudit-group v3 auth sha auth-passphrase-redacted priv aes priv-passphrase-redacted
!
no ip telnet server
line vty 0 15
   transport input ssh
!
ntp authentication-key 1 md5 redacted
ntp server 10.60.10.20 key 1
ntp authenticate
logging host 10.60.10.30
banner login
Authorized access only. All activity is logged and monitored.
EOF
end
