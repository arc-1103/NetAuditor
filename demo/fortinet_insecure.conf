# NetAudit Engine deterministic demo fixture — Fortinet FortiOS
config system global
    set hostname "edge-fw-01"
    set admin-telnet enable
    set admin-port 80
end
config system interface
    edit "wan1"
        set ip 10.30.0.1 255.255.255.252
        set allowaccess ping http ssh snmp
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config vpn ipsec phase1-interface
    edit "legacy-tunnel"
        set proposal des-md5 3des-sha1
    next
end
config log syslogd setting
    set status disable
end
