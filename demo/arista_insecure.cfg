! NetAudit Engine deterministic demo fixture — Arista EOS
! Arista
hostname spine-eos-01
daemon TerminAttr
   exec /usr/bin/TerminAttr -disableaaa
   no shutdown
management api http-commands
   no shutdown
   protocol http
management api gnmi
   transport grpc default
!
interface Ethernet1
   description SPINE-UPLINK
   ip address 10.60.0.1/30
!
snmp-server community public ro
snmp-server host 10.60.10.12 version 2c public
!
ip telnet server
line vty 0 15
   transport input telnet ssh
!
ntp server 10.60.10.20
logging buffered 16384
end
