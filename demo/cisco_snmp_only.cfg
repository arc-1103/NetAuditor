! NetAudit Engine deterministic demo fixture — Cisco IOS-XE
! Single-issue fixture: weak SNMP only, everything else hardened.
version 17.9
hostname access-sw-snmp-demo
service timestamps debug datetime msec
service password-encryption
!
interface GigabitEthernet0/1
 description ACCESS-UPLINK
 ip address 10.70.0.1 255.255.255.252
 no shutdown
!
no ip http server
ip ssh version 2
!
snmp-server community public RO
snmp-server host 10.70.10.12 version 2c public
!
ntp server 10.70.10.20
ntp authenticate
logging host 10.70.10.30
!
banner login
Authorized access only. All activity is logged and monitored.
EOF
!
line vty 0 4
 transport input ssh
!
end
