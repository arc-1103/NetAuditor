# NetAudit Engine deterministic demo fixture — Fortinet FortiOS (hardened)
config system global
    set hostname "edge-fw-02"
    set admin-telnet disable
    set admin-port 8443
end
config system interface
    edit "wan1"
        set ip 10.30.0.5 255.255.255.252
        set allowaccess ping https ssh
    next
end
config system snmp sysinfo
    set status enable
end
config system snmp user
    edit "netaudit-ro"
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
    next
end
config vpn ipsec phase1-interface
    edit "hardened-tunnel"
        set proposal aes256-sha256
    next
end
config log syslogd setting
    set status enable
    set server "10.30.10.30"
end
config system replacemsg admin "pre_login-disclaimer"
    set buffer "Authorized access only. All activity is logged and monitored."
end
