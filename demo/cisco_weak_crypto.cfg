! NetAudit Engine deterministic demo fixture — Cisco IOS-XE
! Single-issue fixture: weak IKE/IPsec proposal only, everything else hardened.
version 17.9
hostname vpn-router-crypto-demo
service timestamps debug datetime msec
service password-encryption
!
interface GigabitEthernet0/0
 description WAN-VPN
 ip address 10.72.0.1 255.255.255.252
 no shutdown
!
no ip http server
ip ssh version 2
!
snmp-server group netaudit-group v3 priv
snmp-server user netaudit-ro netaudit-group v3 auth sha auth-pass-redacted priv aes 256 priv-pass-redacted
!
crypto isakmp policy 10
 encryption 3des
 hash md5
 authentication pre-share
 group 2
!
ntp server 10.72.10.20
ntp authenticate
logging host 10.72.10.30
!
banner login
Authorized access only. All activity is logged and monitored.
EOF
!
line vty 0 4
 transport input ssh
!
end
