# NetAudit Engine deterministic demo fixture — Fortinet FortiOS
# Single-issue fixture: weak SNMP community only, everything else hardened.
config system global
    set hostname "branch-fw-snmp-demo"
    set admin-telnet disable
    set admin-port 8443
end
config system interface
    edit "wan1"
        set ip 10.31.0.1 255.255.255.252
        set allowaccess ping https ssh
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end
config vpn ipsec phase1-interface
    edit "hardened-tunnel"
        set proposal aes256-sha256
    next
end
config log syslogd setting
    set status enable
    set server "10.31.10.30"
end
