## NetAudit Engine deterministic demo fixture — Juniper JunOS (hardened)
set version 21.4R3
set system host-name edge-router-jnpr-02
set system services ssh root-login deny
set system login user netops class super-user authentication encrypted-password "$6$redacted"
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.40.0.5/30;
            }
        }
    }
}
set snmp v3 usm local-engine user netaudit-ro authentication-sha authentication-password "redacted"
set snmp v3 usm local-engine user netaudit-ro privacy-aes128 privacy-password "redacted"
set system ntp server 10.40.10.20
set system ntp authentication-key 1 type sha1 value "redacted"
set system syslog host 10.40.10.30 any notice
set system login message "Authorized access only. All activity is logged and monitored."
