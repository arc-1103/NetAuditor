! NetAudit Engine deterministic demo fixture — Cisco IOS-XE
! Larger topology fixture: multiple interfaces and a routing neighbor, to
! demonstrate blast-radius/topology context alongside the usual findings.
version 17.9
hostname dc-core-01
service timestamps debug datetime msec
no service password-encryption
!
interface GigabitEthernet0/0
 description CORE-UPLINK-1
 ip address 10.100.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description CORE-UPLINK-2
 ip address 10.100.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description SERVER-FARM-A
 ip address 10.100.1.1 255.255.255.0
 no shutdown
!
router bgp 65001
 neighbor 10.100.0.2 remote-as 65002
 neighbor 10.100.0.6 remote-as 65003
!
ip http server
ip ssh version 1
!
snmp-server community public RO
snmp-server host 10.100.10.12 version 2c public
!
ntp server 10.100.10.20
logging buffered 16384
!
line vty 0 4
 transport input telnet ssh
!
end
