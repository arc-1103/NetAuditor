! NetAudit Engine deterministic demo fixture — Cisco IOS-XE
! Minimal/edge-case fixture: barely any configuration present, tests
! how the pipeline handles sparse input (no SNMP, no NTP, no crypto blocks).
version 17.9
hostname lab-switch-minimal
service timestamps debug datetime msec
service password-encryption
!
interface GigabitEthernet0/1
 ip address 10.90.0.1 255.255.255.252
 no shutdown
!
ip ssh version 2
no ip http server
!
line vty 0 4
 transport input ssh
!
end
