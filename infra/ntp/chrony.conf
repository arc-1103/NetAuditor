# Internal time source for the isolated network (chrony).
#
# Devices, servers and this stack should all sync to THIS server, so every
# timestamp in the ledger, reports and CEF events shares one clock.
#
# 1) Preferred: a GPS/PPS-disciplined Stratum 1 receiver on the host. Enable
#    the matching refclock line and pass the device into the container.
#refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2
#refclock PPS /dev/pps0 lock GPS refid PPS
#
# 2) Or an upstream internal Stratum 1/2 server reachable inside the boundary:
#server ntp-upstream.internal iburst
#
# 3) Fallback so the network stays self-consistent when no reference is
#    reachable. It keeps devices agreeing with each other; it does NOT make
#    the time correct — prefer 1) or 2) for evidence-grade time.
local stratum 10 orphan

allow all
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/chrony.drift
log tracking measurements statistics
logdir /var/log/chrony
