version: "3.9"

networks:
  audit-net:
    internal: true
    name: ${NETWORK_NAME:-audit-net}

services:
  postgres:
    image: postgres:16
    env_file: .env
    networks: [audit-net]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    networks: [audit-net]

  minio:
    image: minio/minio
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [audit-net]

  chromadb:
    image: chromadb/chroma
    networks: [audit-net]

  opa:
    image: openpolicyagent/opa:1.20.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes: ["./services/compliance/policies:/policies:ro"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [audit-net]

  ollama:
    image: ollama/ollama
    networks: [audit-net]

  batfish:
    image: batfish/allinone
    networks: [audit-net]

  ingestion:
    build: ./services/ingestion
    env_file: ./services/ingestion/.env
    depends_on: [redis, minio, postgres]
    networks: [audit-net]

  parsing:
    build:
      context: .
      dockerfile: services/parsing/Dockerfile
    env_file: ./services/parsing/.env
    depends_on: [redis, ollama, chromadb]
    networks: [audit-net]

  compliance:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    depends_on: [opa, postgres, redis]
    networks: [audit-net]

  compliance-worker:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    command: python -m app.worker
    depends_on: [opa, postgres, redis]
    networks: [audit-net]

  learning:
    build: ./services/learning/backend
    env_file: ./services/learning/.env
    depends_on: [chromadb, postgres]
    networks: [audit-net]

  remediation:
    build: ./services/remediation
    env_file: ./services/remediation/.env
    depends_on: [batfish, postgres]
    networks: [audit-net]

  reporting:
    build: ./services/reporting
    env_file: ./services/reporting/.env
    depends_on: [postgres]
    volumes:
      - reportdata:/data/reports
    networks: [audit-net]

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    depends_on: [ingestion, compliance, learning, remediation, reporting]
    networks: [audit-net]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on: [gateway]
    networks: [audit-net]

volumes:
  pgdata:
  miniodata:
  reportdata:
