# Skeleton — infra lane fills in build contexts / images.
# Each service loads ITS OWN env_file so lanes stay decoupled.
version: "3.9"

networks:
  audit-net:
    internal: true
    name: ${NETWORK_NAME:-audit-net}

services:
  postgres:
    image: postgres:16
    env_file: .env
    networks: [audit-net]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    networks: [audit-net]

  # Raw config object store. MINIO_ROOT_USER/PASSWORD come from root .env and
  # are what services/*/.env use as MINIO_ACCESS_KEY/MINIO_SECRET_KEY.
  # The `raw-configs` bucket is created on first use by the ingestion service
  # (services/ingestion/app/uploader.py::get_minio_client), so there's no
  # bootstrap job here.
  # NOTE: audit-net is internal, so the :9001 console is not reachable from the
  # host. To look at it during development:
  #   docker compose exec minio mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   docker compose exec minio mc ls local/raw-configs
  minio:
    image: minio/minio
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [audit-net]

  chromadb:
    image: chromadb/chroma
    networks: [audit-net]

  # Policy engine for the Compliance lane. Pinned: the Rego in
  # services/compliance/policies/ is v1 syntax and was verified against this
  # version — `opa test policies/` is the gate. The bundle is mounted, not
  # baked into an image, so editing a .rego file needs only a container restart.
  opa:
    image: openpolicyagent/opa:1.20.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes: ["./services/compliance/policies:/policies:ro"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [audit-net]

  ollama:
    image: ollama/ollama
    networks: [audit-net]

  batfish:
    image: batfish/allinone
    networks: [audit-net]

  ingestion:
    build: ./services/ingestion
    env_file: ./services/ingestion/.env
    depends_on: [redis, minio, postgres]
    networks: [audit-net]

  parsing:
    build: ./services/parsing
    env_file: ./services/parsing/.env
    depends_on: [ollama, chromadb]
    networks: [audit-net]

  # Read side: serves GET /audit-runs/{id} to the Gateway, plus POST /evaluate.
  compliance:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    depends_on: [opa, postgres, redis]
    networks: [audit-net]

  # Write side: consumes the `compliance.evaluate_baseline` task the Parsing
  # lane publishes. Same image, different command — see services/compliance/app/worker.py.
  compliance-worker:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    command: python -m app.worker
    depends_on: [opa, postgres, redis]
    networks: [audit-net]

  learning:
    build: ./services/learning/backend
    env_file: ./services/learning/.env
    depends_on: [chromadb, postgres]
    networks: [audit-net]

  remediation:
    build: ./services/remediation
    env_file: ./services/remediation/.env
    depends_on: [batfish, postgres]
    networks: [audit-net]

  reporting:
    build: ./services/reporting
    env_file: ./services/reporting/.env
    depends_on: [postgres]
    volumes:
      - reportdata:/data/reports
    networks: [audit-net]

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    depends_on: [ingestion, compliance, learning, remediation, reporting]
    networks: [audit-net]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on: [gateway]
    networks: [audit-net]

volumes:
  pgdata:
  miniodata:
  reportdata:
