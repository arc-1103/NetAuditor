networks:
  audit-net:
    internal: true
    name: ${NETWORK_NAME:-audit-net}
  # Docker never publishes ports for containers attached only to an internal
  # network. Only the ingress services (gateway, frontend, nginx) join this one;
  # everything else stays on audit-net with no route out.
  edge:
    name: ${EDGE_NETWORK_NAME:-audit-edge}
  # The Learning service's only network. `internal: true` gives it no route in
  # from the host or out to the internet, and no port is published for it. Only
  # the four callers (gateway, parsing, compliance, remediation) and the data
  # stores it uses (postgres, redis, chromadb) join, so every other container
  # (ingestion, reporting, frontend, nginx, keycloak, ...) cannot even resolve
  # `learning`. Requests must also carry a signed service token (SERVICE_JWT_SECRET).
  learning-net:
    internal: true
    name: ${LEARNING_NETWORK_NAME:-learning-net}

services:
  postgres:
    image: postgres:16.4
    env_file: .env
    networks: [audit-net, learning-net]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.0-alpine
    networks: [audit-net, learning-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: chainguard/minio:latest
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [audit-net]

  chromadb:
    image: chromadb/chroma
    profiles: ["advanced"]
    networks: [audit-net, learning-net]
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.20.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes: ["./services/compliance/policies:/policies:ro"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [audit-net]

  ollama:
    image: ollama/ollama
    profiles: ["model"]
    networks: [audit-net]
    environment:
      # Keep the model resident: a cold load can take 90s+ from a bind mount and
      # would otherwise recur after every 5 idle minutes, timing out the parser.
      OLLAMA_KEEP_ALIVE: "-1"
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      # Point OLLAMA_MODELS_DIR at an existing host Ollama model folder to reuse it.
      - ${OLLAMA_MODELS_DIR:-./infra/ollama/models}:/root/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
    # Run the model on the NVIDIA GPU (needs Docker Desktop's WSL2 GPU support).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # One-shot, idempotent model bootstrap. Pre-pull this before an air-gapped
  # presentation; subsequent starts reuse the persistent ollamadata volume.
  ollama-bootstrap:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1 || ollama pull \"$$OLLAMA_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [audit-net]
    restart: "no"
    profiles: ["model"]

  batfish:
    image: batfish/allinone
    profiles: ["advanced"]
    networks: [audit-net]

  siem-forwarder:
    image: fluent/fluent-bit:3.1
    # Receives NetAudit's webhook events, converts them to CEF, and (with
    # SIEM_CONFIG=siem.conf) forwards them by syslog to SIEM_HOST:SIEM_PORT.
    # The default stdout.conf only prints the CEF lines, so nothing leaves
    # the host unless an operator opts in.
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/${SIEM_CONFIG:-stdout.conf}"]
    environment:
      SIEM_HOST: ${SIEM_HOST:-127.0.0.1}
      SIEM_PORT: ${SIEM_PORT:-514}
      SIEM_MODE: ${SIEM_MODE:-tcp}
    volumes:
      - ./infra/fluent-bit:/fluent-bit/etc:ro
    networks: [audit-net]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["iam"]
    # start-dev keeps Keycloak's data in its embedded H2 store, which is fine
    # for evaluation. For production run `start` with a Postgres database,
    # TLS and a real hostname (see docs/IAM_KEYCLOAK.md).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:-}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/netaudit-realm.json:/opt/keycloak/data/import/netaudit-realm.json:ro
      - keycloakdata:/opt/keycloak/data
    networks: [audit-net]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.17
    profiles: ["secrets"]
    # Production-style server (file storage, sealed at start) — NOT dev mode.
    # First run needs `vault operator init` and `vault operator unseal`; see
    # docs/SECRETS_VAULT.md. Services read secrets via VAULT_ADDR (see
    # infra/vault/vault_loader.py); with it unset they use their .env as before.
    command: ["server", "-config=/vault/config/config.hcl"]
    cap_add: [IPC_LOCK]
    volumes:
      - ./infra/vault/config.hcl:/vault/config/config.hcl:ro
      - vaultdata:/vault/file
    networks: [audit-net]
    restart: unless-stopped

  ntp:
    image: simonrupf/chronyd:latest
    profiles: ["time"]
    # Internal NTP server for devices and hosts in the isolated network. Edit
    # infra/ntp/chrony.conf to point at a GPS/PPS receiver or an internal
    # Stratum 1/2 source (see docs/TIME_SYNC.md). Serving time needs UDP 123
    # and the SYS_TIME capability to discipline the host clock only if you
    # run this as the host's own time source; by default it only serves.
    volumes:
      - ./infra/ntp/chrony.conf:/etc/chrony/chrony.conf:ro
    ports:
      - "123:123/udp"
    networks: [audit-net]
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.0
    profiles: ["advanced"]
    # Not env_file: .env — the neo4j image maps every NEO4J_-prefixed var it
    # receives into neo4j.conf (NEO4J_HOST -> host, NEO4J_BOLT_PORT ->
    # bolt.port, ...) and refuses to start on a setting it doesn't
    # recognize. NEO4J_AUTH is the one variable the image special-cases
    # (it configures the initial username/password); everything else in
    # the root .env is for the app-side NEO4J_* vars services read via
    # os.getenv (see services/compliance/.env.example), not for this
    # container. Compose auto-loads the root .env for ${...}
    # substitution below regardless of env_file, so this still picks up
    # the same NEO4J_AUTH value.
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [audit-net]

  ingestion:
    build: ./services/ingestion
    env_file: ./services/ingestion/.env
    environment:
      # Online collection (Netmiko/NAPALM). Off by default so an air-gapped
      # deployment cannot reach devices; enable per environment and list the
      # management networks it may contact.
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      COLLECTOR_ALLOWED_CIDRS: ${COLLECTOR_ALLOWED_CIDRS:-}
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  parsing:
    build:
      context: .
      dockerfile: services/parsing/Dockerfile
    env_file: ./services/parsing/.env
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [audit-net, learning-net]
    restart: unless-stopped
    # Sandbox: this container parses attacker-influenced config text (regex
    # parsers, local LLM prompts), so assume it can be exploited and limit
    # what an exploit gets. Docker's default seccomp profile applies on top.
    # For a stronger boundary set PARSER_RUNTIME=runsc (gVisor) on hosts that
    # have it, or add an AppArmor profile — see docs/PARSER_SANDBOX.md.
    runtime: ${PARSER_RUNTIME:-runc}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
      PYTHONDONTWRITEBYTECODE: "1"

  compliance:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://siem-forwarder:9880/netaudit.event}
      # Tamper-evident ledger sealing (docs/LEDGER_INTEGRITY.md). The Ed25519
      # signing key comes from Vault (LEDGER_SIGNING_KEY) or a mounted file.
      LEDGER_SIGNING_KEY_FILE: ${LEDGER_SIGNING_KEY_FILE:-}
      LEDGER_SEAL_INTERVAL_SECONDS: ${LEDGER_SEAL_INTERVAL_SECONDS:-0}
    depends_on:
      opa: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [audit-net, learning-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  compliance-worker:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://siem-forwarder:9880/netaudit.event}
    command: python -m app.worker
    depends_on:
      opa: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [audit-net, learning-net]
    restart: unless-stopped

  learning:
    build: ./services/learning/backend
    profiles: ["advanced"]
    env_file: ./services/learning/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [learning-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  learning-worker:
    build: ./services/learning/backend
    profiles: ["advanced"]
    env_file: ./services/learning/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
    command: python -m app.unknown_handler
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [learning-net]
    restart: unless-stopped

  remediation:
    build: ./services/remediation
    env_file: ./services/remediation/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://siem-forwarder:9880/netaudit.event}
      # Management networks the digital twin must keep reachable (SSH) when it
      # simulates a fix, e.g. "192.168.50.0/24,10.10.0.0/16" (docs/DIGITAL_TWIN.md).
      TWIN_PROTECTED_SUBNETS: ${TWIN_PROTECTED_SUBNETS:-}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [audit-net, learning-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  reporting:
    build: ./services/reporting
    env_file: ./services/reporting/.env
    environment:
      # Internal time source this report checks its clock against (docs/TIME_SYNC.md).
      NTP_SERVER: ${NTP_SERVER:-}
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - reportdata:/data/reports
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    environment:
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (scripts/setup_demo.sh generates it)}
      UPSTREAM_TIMEOUT_SECONDS: "250"
      # local = users table + gateway-issued JWTs; keycloak = verify Keycloak's
      # RS256 tokens (start the "iam" profile and set AUTH_PROVIDER=keycloak).
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: netaudit
      KEYCLOAK_CLIENT_ID: netaudit-web
    depends_on:
      ingestion: {condition: service_healthy}
      compliance: {condition: service_healthy}
      remediation: {condition: service_healthy}
      reporting: {condition: service_healthy}
    networks: [audit-net, edge, learning-net]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    depends_on:
      gateway: {condition: service_healthy}
    networks: [audit-net, edge]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    depends_on:
      gateway: {condition: service_healthy}
      frontend: {condition: service_started}
    networks: [audit-net, edge]
    ports:
      - "${NGINX_PORT:-443}:443"
    volumes:
      - nginxcerts:/etc/nginx/certs
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  reportdata:
  neo4jdata:
  keycloakdata:
  vaultdata:
  nginxcerts:
  chromadata:
