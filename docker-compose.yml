networks:
  audit-net:
    internal: true
    name: ${NETWORK_NAME:-audit-net}

services:
  postgres:
    image: postgres:16.4
    env_file: .env
    networks: [audit-net]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.0-alpine
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [audit-net]

  chromadb:
    image: chromadb/chroma
    networks: [audit-net]
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.20.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes: ["./services/compliance/policies:/policies:ro"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [audit-net]

  ollama:
    image: ollama/ollama
    networks: [audit-net]
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  # One-shot, idempotent model bootstrap. Pre-pull this before an air-gapped
  # presentation; subsequent starts reuse the persistent ollamadata volume.
  ollama-bootstrap:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1 || ollama pull \"$$OLLAMA_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [audit-net]
    restart: "no"
    profiles: ["model"]

  batfish:
    image: batfish/allinone
    networks: [audit-net]

  neo4j:
    image: neo4j:5.24.0
    # Not env_file: .env — the neo4j image maps every NEO4J_-prefixed var it
    # receives into neo4j.conf (NEO4J_HOST -> host, NEO4J_BOLT_PORT ->
    # bolt.port, ...) and refuses to start on a setting it doesn't
    # recognize. NEO4J_AUTH is the one variable the image special-cases
    # (it configures the initial username/password); everything else in
    # the root .env is for the app-side NEO4J_* vars services read via
    # os.getenv (see services/compliance/.env.example), not for this
    # container. Compose auto-loads the root .env for ${...}
    # substitution below regardless of env_file, so this still picks up
    # the same NEO4J_AUTH value.
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [audit-net]

  ingestion:
    build: ./services/ingestion
    env_file: ./services/ingestion/.env
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  parsing:
    build:
      context: .
      dockerfile: services/parsing/Dockerfile
    env_file: ./services/parsing/.env
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [audit-net]
    restart: unless-stopped

  compliance:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    depends_on:
      opa: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      learning: {condition: service_healthy}
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  compliance-worker:
    build: ./services/compliance
    env_file: ./services/compliance/.env
    command: python -m app.worker
    depends_on:
      opa: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      learning: {condition: service_healthy}
    networks: [audit-net]
    restart: unless-stopped

  learning:
    build: ./services/learning/backend
    env_file: ./services/learning/.env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  learning-worker:
    build: ./services/learning/backend
    env_file: ./services/learning/.env
    command: python -m app.unknown_handler
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [audit-net]
    restart: unless-stopped

  remediation:
    build: ./services/remediation
    env_file: ./services/remediation/.env
    depends_on:
      postgres: {condition: service_healthy}
      learning: {condition: service_healthy}
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  reporting:
    build: ./services/reporting
    env_file: ./services/reporting/.env
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - reportdata:/data/reports
    networks: [audit-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    depends_on:
      ingestion: {condition: service_healthy}
      compliance: {condition: service_healthy}
      learning: {condition: service_healthy}
      remediation: {condition: service_healthy}
      reporting: {condition: service_healthy}
    networks: [audit-net]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    depends_on:
      gateway: {condition: service_healthy}
    networks: [audit-net]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  reportdata:
  neo4jdata:
  chromadata:
  ollamadata:
